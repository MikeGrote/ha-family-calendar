name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Build
        run: npm run build

      # Das gebaute Bundle liegt im Repo, damit die Integration ohne
      # Node-Toolchain installierbar ist. Dann muss es aber auch zum
      # Quellcode passen - sonst deployt jemand eine veraltete Karte.
      - name: Bundle stimmt mit dem Quellcode ueberein
        run: |
          if ! git diff --exit-code -- custom_components/calendar_service_ext/www/; then
            echo "::error::Das eingecheckte Bundle ist veraltet. Bitte 'npm run build' ausfuehren und das Ergebnis committen."
            exit 1
          fi

  python:
    name: Python (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Kein v4-Major-Tag vorhanden - exakte Version referenzieren.
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: 0.15.15
          args: check custom_components/

  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS-Validierung
    runs-on: ubuntu-latest
    # Deaktiviert. Der Job scheitert an einem Check, der sich nicht im Repo
    # loesen laesst: HACS verlangt GitHub-Topics, und die werden ueber die
    # Repo-Einstellungen gesetzt, nicht ueber eine Datei.
    # Wieder aktivieren: Topics unter "About" setzen (z.B. home-assistant,
    # hacs, lovelace, calendar), dann diese Zeile entfernen.
    if: false
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
          comment: false
          # brands:  Ein Eintrag in home-assistant/brands ist fuer ein
          #          eigenes Repo weder vorhanden noch vorgesehen.
          # license: Das Projekt steht unter CC BY-NC 4.0. GitHubs
          #          Lizenzerkennung kennt von den CC-Lizenzen nur CC0,
          #          CC-BY-4.0 und CC-BY-SA-4.0 und meldet fuer alles
          #          andere NOASSERTION. Der Check kann damit nie gruen
          #          werden, ohne die Nicht-kommerziell-Klausel
          #          aufzugeben - und die ist gewollt.
          ignore: brands license
